<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Intelligent App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen relative overflow-hidden font-sans">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0 bg-gray-900">
        <img src="weather_house_bg.jpg" alt="Background" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-[#2C244B]/90"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex flex-col h-screen pt-12 pb-6 px-6 max-w-md mx-auto">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-8 relative">
            <div id="current-time" class="text-lg font-bold text-white drop-shadow-md"></div>
            <div class="relative z-50">
                <div class="relative flex items-center">
                    <input type="text" id="search-input" placeholder="Search city..." autocomplete="off"
                        class="w-48 h-12 bg-white/20 border border-white/30 rounded-full px-4 text-white placeholder-white/70 focus:outline-none focus:border-white transition-colors backdrop-blur-sm">
                    <button id="search-btn" class="absolute right-3 text-white hover:text-gray-200">
                        <span class="material-icons-round">search</span>
                    </button>
                </div>
                <!-- Suggestions Dropdown -->
                <div id="suggestions" class="absolute top-14 right-0 w-48 bg-[#3B2F5D] rounded-xl shadow-xl hidden flex-col max-h-48 overflow-y-auto border border-white/10 z-50">
                </div>
            </div>
        </div>

        <!-- Weather Display (Hidden initially) -->
        <div id="weather-content" class="flex-1 flex flex-col hidden">
            <!-- Main Info -->
            <div class="flex flex-col items-center mb-auto pt-4">
                <h1 id="city-name" class="text-4xl font-medium text-white mb-[-5px]">City</h1>
                <div class="text-[80px] font-light text-white leading-none">
                    <span id="current-temp">--</span>&deg;
                </div>
                <div id="weather-desc" class="text-xl font-medium text-white/90">--</div>
                <div class="text-lg font-medium text-white mt-1 drop-shadow-md">
                    H:<span id="max-temp">--</span>&deg;  L:<span id="min-temp">--</span>&deg;
                </div>
            </div>

            <!-- Recommendation Card -->
            <div class="bg-white/20 backdrop-blur-md rounded-2xl p-4 mb-6 flex items-center shadow-lg border border-white/10">
                <span class="material-icons-round text-yellow-400 mr-3 text-2xl">lightbulb</span>
                <p id="recommendation-text" class="text-sm text-white flex-1 leading-tight">Loading recommendation...</p>
            </div>

            <!-- Bottom Sheet -->
            <div class="bg-[#3B2F5D]/85 backdrop-blur-md rounded-t-[40px] p-6 -mx-6 -mb-6 shadow-2xl border-t border-white/10 h-[260px]">
                <!-- Tabs -->
                <div class="flex justify-between mb-4 px-2">
                    <button id="tab-hourly" class="text-white font-semibold text-base focus:outline-none transition-colors">Hourly Forecast</button>
                    <button id="tab-weekly" class="text-white/50 font-semibold text-base focus:outline-none transition-colors">Weekly Forecast</button>
                </div>
                
                <hr class="border-white/20 mb-5">
                
                <!-- Hourly List -->
                <div id="hourly-list" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar">
                </div>

                <!-- Weekly List -->
                <div id="weekly-list" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar hidden">
                </div>
            </div>
        </div>

        <!-- Loading / Error States -->
        <div id="loading-state" class="flex-1 flex items-center justify-center">
            <div class="w-10 h-10 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
        </div>
        <div id="error-state" class="flex-1 flex items-center justify-center hidden">
            <div class="bg-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10">
                <p id="error-text" class="text-white text-lg text-center">City not found</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
